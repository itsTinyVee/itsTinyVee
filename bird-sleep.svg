      <ellipse cx="234" cy="150" rx="8" ry="4.5" fill="#F7B7A3" opacity="0.65"/>
      <path d="M208 126 Q219 118 232 124" fill="none" stroke="#6b4a2a" stroke-width="2.2" stroke-linecap="round"/>
      <g class="eye">

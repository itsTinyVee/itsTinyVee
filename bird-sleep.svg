<svg xmlns="http://www.w3.org/2000/svg" viewBox="108 50 352 310" width="352" height="310" role="img" aria-label="A cream and golden bird sleeping in a nest, waking up to look at the sky, then settling back to sleep">
  <defs>
    <linearGradient id="gBody" gradientUnits="userSpaceOnUse" x1="205" y1="110" x2="360" y2="240">
      <stop offset="0" stop-color="#FFF8E4"/><stop offset="1" stop-color="#F3D9A2"/>
    </linearGradient>
    <linearGradient id="gGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8DEA6"/><stop offset="1" stop-color="#E0B064"/>
    </linearGradient>
    <linearGradient id="gTail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBE8BC"/><stop offset="1" stop-color="#E7BE78"/>
    </linearGradient>
    <linearGradient id="gNest" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B98C5C"/><stop offset="1" stop-color="#7C5330"/>
    </linearGradient>
    <clipPath id="bowl"><path d="M184 214 C184 262 232 288 288 288 C344 288 392 262 392 214 C370 232 330 238 288 238 C246 238 206 232 184 214 Z"/></clipPath>
  </defs>
  <style>
.settle { transform-origin: 294px 262px; animation: settle 14.0s ease-in-out infinite; }
.head   { transform-origin: 262px 178px; animation: head 14.0s ease-in-out infinite; }
.wing   { transform-origin: 284px 170px; animation: wing 14.0s ease-in-out infinite; }
.eye    { transform-box: fill-box; transform-origin: center; animation: eye 14.0s ease-in-out infinite; }
.arc    { animation: arc 14.0s linear infinite; }
.pupil  { animation: pupil 14.0s ease-in-out infinite; }
.breath { transform-origin: 288px 250px; animation: breath 3.5s ease-in-out infinite; }
.tail   { transform-origin: 346px 196px; animation: sway 3.5s ease-in-out infinite; }
.zwrap  { animation: zshow 14.0s linear infinite; }
.z      { font-family: ui-rounded, 'Segoe UI', Arial, sans-serif; font-weight: 800; fill: #9ad0ff; animation: zfloat 3.5s ease-out infinite; opacity: 0; }
.z2 { animation-delay: -1.17s; } .z3 { animation-delay: -2.33s; }
@keyframes breath { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.018, 1.03); } }
@keyframes sway { 0%, 100% { transform: rotate(-1.6deg); } 50% { transform: rotate(2.2deg); } }
@keyframes zfloat {
  0%   { opacity: 0; transform: translate(0px, 0px) scale(0.7); }
  20%  { opacity: 1; }
  80%  { opacity: 0.8; }
  100% { opacity: 0; transform: translate(-14px, -34px) scale(1.15); }
}
@keyframes head {
  0.000% { transform: translate(16px,-2px) rotate(-34deg) scale(1,1); }
  28.571% { transform: translate(16px,-2px) rotate(-34deg) scale(1,1); }
  34.286% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
  39.286% { transform: translate(0px,-2px) rotate(34deg) scale(1,1); }
  44.286% { transform: translate(0px,-2px) rotate(30deg) scale(1,1); }
  49.286% { transform: translate(0px,-2px) rotate(41deg) scale(1,1); }
  54.286% { transform: translate(0px,-2px) rotate(33deg) scale(1,1); }
  59.286% { transform: translate(0px,-2px) rotate(39deg) scale(1,1); }
  64.286% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
  72.857% { transform: translate(16px,-2px) rotate(-34deg) scale(1,1); }
  100.000% { transform: translate(16px,-2px) rotate(-34deg) scale(1,1); }
}
@keyframes eye {
  0.000% { transform: scaleY(0); }
  28.571% { transform: scaleY(0); }
  32.857% { transform: scaleY(1); }
  49.643% { transform: scaleY(1); }
  50.357% { transform: scaleY(0); }
  51.429% { transform: scaleY(1); }
  64.286% { transform: scaleY(1); }
  68.571% { transform: scaleY(0.55); }
  71.429% { transform: scaleY(0.25); }
  73.571% { transform: scaleY(0); }
  100.000% { transform: scaleY(0); }
}
@keyframes arc {
  0.000% { opacity: 1; }
  28.571% { opacity: 1; }
  30.714% { opacity: 0; }
  72.857% { opacity: 0; }
  75.000% { opacity: 1; }
  100.000% { opacity: 1; }
}
@keyframes pupil {
  0.000% { transform: translate(0px,0px); }
  35.714% { transform: translate(0px,0px); }
  40.000% { transform: translate(-2px,-3.8px); }
  60.000% { transform: translate(-2px,-3.8px); }
  64.286% { transform: translate(0px,0px); }
  100.000% { transform: translate(0px,0px); }
}
@keyframes wing {
  0.000% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
  30.714% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
  34.286% { transform: translate(0px,0px) rotate(-10deg) scale(1,1); }
  38.571% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
  70.000% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
  72.143% { transform: translate(0px,0px) rotate(-6deg) scale(1,1); }
  75.714% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
  100.000% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
}
@keyframes settle {
  0.000% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
  31.429% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
  35.000% { transform: translate(0px,-5px) rotate(0deg) scale(1,1.02); }
  39.286% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
  70.000% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
  72.143% { transform: translate(0px,0px) rotate(-3deg) scale(1.03,0.96); }
  75.000% { transform: translate(0px,0px) rotate(3deg) scale(1.03,0.96); }
  77.857% { transform: translate(0px,0px) rotate(-2deg) scale(1.02,0.98); }
  81.429% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
  100.000% { transform: translate(0px,0px) rotate(0deg) scale(1,1); }
}
@keyframes zshow {
  0.000% { opacity: 1; }
  26.429% { opacity: 1; }
  29.286% { opacity: 0; }
  75.714% { opacity: 0; }
  80.714% { opacity: 1; }
  100.000% { opacity: 1; }
}</style>

